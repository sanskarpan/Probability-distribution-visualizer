---
name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please fill in the details so we can reproduce.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. 1.0.0 or main@abc123
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.11.9
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest script that shows the bug, plus expected vs actual output.
      placeholder: |
        from src.distributions import NormalDistribution
        ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: OS, install method (pip/docker), logs, screenshots.
