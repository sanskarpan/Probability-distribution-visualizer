---
name: Documentation
description: Report missing or incorrect docs
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page / file
      placeholder: e.g. docs/advanced.md or README.md#api
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
