name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8 (fatal errors)
        run: flake8 src/ tests/ web/ --count --select=E9,F63,F7,F82 --statistics

      - name: Lint with ruff
        run: ruff check src/ tests/ web/

      - name: Check formatting with black
        run: python -m black --check --line-length=100 src/ tests/ web/

      - name: Check imports with isort
        run: python -m isort --check --profile=black --line-length=100 src/ tests/ web/

      - name: Type check with mypy
        # Target the matrix interpreter so third-party stubs (e.g. numpy>=2.5
        # PEP 695 `type` aliases) parse under the running Python.
        run: mypy --config-file=pyproject.toml --disable-error-code no-any-return --python-version ${{ matrix.python-version }} src/

      - name: Test with pytest + coverage gate
        run: pytest tests/ -q --cov=src --cov-report=term --cov-fail-under=80

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-term
          path: .coverage
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and run pip-audit
        run: |
          python -m pip install --upgrade pip setuptools
          pip install pip-audit
          pip-audit

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: probviz:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Python package
        run: |
          python -m pip install --upgrade pip build
          python -m build
