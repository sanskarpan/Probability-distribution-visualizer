site_name: Probability Distribution Visualizer
site_description: Interactive probability distribution visualizer with univariate, multivariate, copula, mixture, fitting, Monte Carlo, and statistical-test toolkits.
site_author: Sanskar Pan and contributors
site_url: https://sanskarpan.github.io/probviz/
repo_url: https://github.com/sanskarpan/probviz
repo_name: sanskarpan/probviz
copyright: Copyright &copy; 2024-2026 Sanskar Pan and contributors (MIT)

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: quickstart.md
      - Installation: installation.md
  - User Guide:
      - Univariate Distributions: distributions.md
      - Multivariate & Copulas: advanced.md
      - Fitting & Model Selection: fitting.md
      - Monte Carlo: monte-carlo.md
      - Statistical Tests: statistical-tests.md
      - Web App: web-app.md
  - API Reference: api.md
  - Examples: examples.md
  - Development:
      - Contributing: contributing.md
      - Architecture: architecture.md
      - Changelog: changelog.md
  - Archive (historical notes): archive/index.md
